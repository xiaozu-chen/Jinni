name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: ruff check .
      - run: pyright
      - run: python -m pytest
