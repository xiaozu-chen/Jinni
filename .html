<!doctype html>
<html lang="en">



<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title</title>
    <style>
        :root {
            $light_vars --c: var(--c0);
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                $dark_vars
            }
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, "Segoe UI", sans-serif;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 4px;
        }

        p.sub {
            color: var(--muted);
            margin: 0 0 16px;
            font-size: .9rem;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .s0 {
            --c: var(--c0);
        }

        .s1 {
            --c: var(--c1);
        }

        .s2 {
            --c: var(--c2);
        }

        .s3 {
            --c: var(--c3);
        }

        .s4 {
            --c: var(--c4);
        }

        .s5 {
            --c: var(--c5);
        }

        .s6 {
            --c: var(--c6);
        }

        .s7 {
            --c: var(--c7);
        }

        .grid {
            stroke: var(--grid);
            stroke-width: 1;
        }

        .axis {
            stroke: var(--muted);
            stroke-width: 1;
        }

        .tick,
        .xlabel,
        .axis-title {
            fill: var(--muted);
            font-size: 12px;
        }

        .value {
            fill: var(--fg);
            font-size: 11px;
        }

        .bar,
        .dot,
        .swatch,
        .slice {
            fill: var(--c);
        }

        .slice {
            stroke: var(--bg);
            stroke-width: 2;
        }

        .hole {
            fill: var(--bg);
        }

        .line {
            fill: none;
            stroke: var(--c);
            stroke-width: 2.5;
            stroke-linejoin: round;
        }

        .s1.line {
            stroke-dasharray: 6 3;
        }

        .s2.line {
            stroke-dasharray: 2 3;
        }

        .s3.line {
            stroke-dasharray: 8 2 2 2;
        }

        .s4.line {
            stroke-dasharray: 1 3;
        }

        .s5.line {
            stroke-dasharray: 10 3;
        }

        .s6.line {
            stroke-dasharray: 4 2 1 2;
        }

        .s7.line {
            stroke-dasharray: 5 1;
        }

        .legend {
            fill: var(--fg);
            font-size: 12px;
        }

        .legend-value {
            fill: var(--muted);
            font-size: 12px;
        }

        "" " + HEATMAP_CSS + " ""
        $extra
    </style>
</head>

<body>
    <main>
        <h1>$title</h1>
        <p class="sub">$subtitle</p>
        $svg
    </main>
</body>

</html>
