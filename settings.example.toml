base_url = "http://127.0.0.1:8080/v1"
model = "qwen3.5"
system_prompt = "You are Jinni, a helpful local AI agent. Keep answers concise."
max_steps = 8
context_limit = 16384
thinking_default = false
# Optional tiny OpenAI-compatible classifier. Leave model empty to use the default above.
# thinking_classifier_model = "your-small-model-alias"
# thinking_classifier_base_url = "http://127.0.0.1:8082/v1"
# thinking_classifier_timeout = 3.0
# Read-only subagent research is disabled until the local A/B evaluation is recorded.
subagents_enabled = false
subagent_tools = ["read_file", "search_files", "find_files", "code_outline", "project_tree"]
subagent_max_laps = 6
subagent_timeout = 90.0
subagent_task_chars = 500
subagent_result_chars = 600
subagent_max_pointers = 8
subagent_thinking = false
parallel_tools = true
memory_file = "memory.txt"
memory_db = "memory.db"
log_file = "jinni.log"
embed_enabled = true
embed_url = "http://127.0.0.1:8081/v1"
# Optional. If set, Jinni starts and stops only this configured process.
# embed_server_command = "C:/llama.cpp/llama-server.exe"
# embed_server_args = ["-m", "C:/models/nomic-embed-text-v1.5.Q8_0.gguf", "--embedding", "--pooling", "mean", "-c", "2048", "-ub", "2048", "-np", "1", "-ngl", "0", "--port", "8081", "--host", "127.0.0.1"]
min_similarity = 0.5
near_duplicate_similarity = 0.82
mcp_enabled = true
mcp_servers_file = "mcp_servers.json"
mcp_auto_restart = true
mcp_restart_initial_delay = 1.0
mcp_restart_max_delay = 30.0
powershell_enabled = false
png_theme = "light"
png_width = 1280
png_height = 720
png_scale = 2.0
